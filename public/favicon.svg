<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Royal Velvet Maroon Gradient -->
    <radialGradient id="maroonVelvet" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#a8002e"/>
      <stop offset="55%" stop-color="#800020"/>
      <stop offset="90%" stop-color="#520013"/>
      <stop offset="100%" stop-color="#3d000d"/>
    </radialGradient>

    <!-- Luxury Pure Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d4"/>
      <stop offset="25%" stop-color="#f3d484"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Soft Gold Inner Accent -->
    <linearGradient id="goldSoft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fcedc7"/>
      <stop offset="70%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#9e6e18"/>
    </linearGradient>

    <!-- Drop Shadow for Atelier Crest -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffd700" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Background Disc -->
  <g filter="url(#luxuryGlow)">
    <circle cx="100" cy="100" r="92" fill="url(#goldLuxury)"/>
    <circle cx="100" cy="100" r="88" fill="#2d000b"/>
    <circle cx="100" cy="100" r="86" fill="url(#maroonVelvet)"/>
  </g>

  <!-- Fine Inner Gold Beaded Border -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldLuxury)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.85"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#goldSoft)" stroke-width="1" opacity="0.6"/>

  <!-- Top Atelier Crown & Diamond Sparkle -->
  <g filter="url(#subtleGlow)" fill="url(#goldLuxury)">
    <!-- Central Starlight Diamond -->
    <path d="M100 28 L103 36 L111 39 L103 42 L100 50 L97 42 L89 39 L97 36 Z"/>
    <!-- Left Starlet -->
    <circle cx="82" cy="39" r="1.8"/>
    <!-- Right Starlet -->
    <circle cx="118" cy="39" r="1.8"/>
  </g>

  <!-- Luxury Monogram "G" and "D" Intertwined with Atelier Gift Ribbon -->
  <g filter="url(#subtleGlow)" fill="none" stroke="url(#goldLuxury)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter G: Classical Serif Atelier Flow -->
    <path d="M110 68 C96 61, 68 66, 60 84 C52 101, 57 125, 74 136 C89 145, 108 141, 116 130 C122 121, 122 109, 122 105 L96 105" 
          stroke-width="7.5" stroke-linecap="round"/>
    
    <!-- Letter D: Interlocking Grand Arch -->
    <path d="M96 68 L96 136 C112 136, 138 132, 142 102 C146 72, 118 68, 96 68 Z" 
          stroke-width="6.5" stroke-linecap="round"/>

    <!-- Gift Ribbon Knot / Heart Knot Center -->
    <path d="M88 102 C82 92, 74 95, 78 104 C82 112, 100 120, 100 120 C100 120, 118 112, 122 104 C126 95, 118 92, 112 102 C107 109, 100 114, 100 114 C100 114, 93 109, 88 102 Z"
          fill="url(#goldLuxury)" stroke="none"/>
  </g>

  <!-- Bottom Gift Ribbon / Atelier Banner Accents -->
  <g fill="url(#goldLuxury)" opacity="0.95">
    <!-- Center Mini Diamond -->
    <polygon points="100,158 103,163 100,168 97,163"/>
    <!-- Delicate Filigree Wings -->
    <path d="M92 163 C80 162, 70 156, 62 148 C66 153, 76 160, 92 163 Z"/>
    <path d="M108 163 C120 162, 130 156, 138 148 C134 153, 124 160, 108 163 Z"/>
  </g>
</svg>
